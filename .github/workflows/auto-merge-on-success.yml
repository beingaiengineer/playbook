name: Auto approve and merge pull requests on successful build

on:
  workflow_run:
    workflows: ["Quality"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Approve and merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id
            });
            const pullRequests = run.data.pull_requests;
            if (!pullRequests || pullRequests.length === 0) {
              console.log('No pull requests associated with this run.');
              return;
            }
            const prNumber = pullRequests[0].number;
            
            // Approve
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              event: 'APPROVE',
              body: 'Auto-approved after successful quality checks.'
            });
            
            // Merge
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: 'merge'
            });
